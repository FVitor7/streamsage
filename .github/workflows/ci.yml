name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python version comes from .python-version.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest --cov --cov-report=xml --junitxml=junit-unit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            junit-unit.xml
            coverage.xml

  integration:
    name: Integration tests (real Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start Kafka
        run: docker compose up -d --wait kafka
      - name: Create sample topics
        run: docker compose run --rm kafka-init
      - run: uv run pytest -m integration --junitxml=junit-integration.xml
      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs kafka
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: junit-integration.xml
      - name: Stop Kafka
        if: always()
        run: docker compose down -v
