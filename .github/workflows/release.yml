name: Release

# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed.
# Nothing is published to package registries.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation in the repository
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache in release builds, so a poisoned cache cannot reach a release.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check that the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Quality gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run pytest --cov

      - name: Build sdist and wheel
        run: uv build

      # Install what was just built into clean environments, outside the
      # checkout, and talk to it over MCP. Nothing is released if this fails.
      - name: Smoke-test the wheel (oldest and newest supported Python)
        run: |
          uv run python scripts/smoke_test_package.py dist/*.whl --python 3.12
          uv run python scripts/smoke_test_package.py dist/*.whl --python 3.15

      - name: Smoke-test the sdist
        run: uv run python scripts/smoke_test_package.py dist/*.tar.gz --python 3.12

      # Signed statement that these files were built by this workflow from
      # this tag. Verify with: gh attestation verify <file> --repo <owner/repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Extract release notes
        run: uv run python scripts/release_notes.py "$VERSION" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "StreamSage $TAG" \
            --notes-file release-notes.md
