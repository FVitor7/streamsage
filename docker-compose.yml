# Local development Kafka for StreamSage.
# Single Apache Kafka broker in KRaft mode (combined broker + controller, no ZooKeeper).
#
#   Host clients (StreamSage, tests):   localhost:9092
#   Other containers on this network:   kafka:19092
#
# Topic auto-creation is intentionally left ENABLED (the Kafka default) so the
# integration tests can prove that StreamSage never creates topics as a side
# effect of a read, even on a broker that would allow it.

name: streamsage

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: streamsage-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "streamsage-local-kraft-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # One-shot job that creates sample topics for local exploration and tests.
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: streamsage-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:19092
    restart: "no"

  # Long-running consumer so the local cluster has an *active* consumer group
  # (`inventory-service`) with a member and partition assignment.
  kafka-consumer:
    image: apache/kafka:4.4.0
    container_name: streamsage-kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-console-consumer.sh
      - --bootstrap-server
      - kafka:19092
      - --topic
      - inventory.updated
      - --group
      - inventory-service
      - --consumer-property
      - client.id=inventory-service-1
    restart: unless-stopped

  # Dev-only secured broker for the `security` test suite. Not started by a
  # plain `docker compose up`; use docker/kafka-secure/setup.sh, which also
  # generates the TLS material and the SCRAM user (no secrets in Git).
  #
  #   localhost:9094  SASL_PLAINTEXT (SCRAM-SHA-512)
  #   localhost:9095  SASL_SSL       (SCRAM-SHA-512 + TLS, private test CA)
  kafka-secure:
    image: apache/kafka:4.4.0
    container_name: streamsage-kafka-secure
    hostname: kafka-secure
    profiles: ["security"]
    ports:
      - "9094:9094"
      - "9095:9095"
    environment:
      CLUSTER_ID: "streamsage-local-secure-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure:9093
      KAFKA_LISTENERS: INTERNAL://:19092,SASL_PLAINTEXT://:9094,SASL_SSL://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-secure:19092,SASL_PLAINTEXT://localhost:9094,SASL_SSL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The internal listener is only reachable inside the compose network;
      # it is used for the healthcheck and for creating the SCRAM user.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./docker/kafka-secure/.generated:/etc/kafka/secrets:ro
      - ./docker/kafka-secure/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-secure:19092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # Web UI for browsing the local cluster: http://localhost:8080
  # kafbat/kafka-ui is the maintained fork of provectus/kafka-ui (unmaintained
  # since 2024). Pinned like the Kafka image for reproducible builds.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: streamsage-kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: streamsage-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
